version: '3'

services:
  web:
    build: .
    command: ["sh", "-c", "sleep 10 && python manage.py migrate && python manage.py runserver 0.0.0.0:8000"]
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      - db
    environment:
      - DJANGO_DB_HOST=db
      - DJANGO_DB_PORT=5432
      - DJANGO_DB_NAME=dojistore
      - DJANGO_DB_USER=postgres
      - DJANGO_DB_PASSWORD=@Trinhdilam9.

  db:
    image: postgres
    environment:
      - POSTGRES_DB=dojistore
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=@Trinhdilam9.
