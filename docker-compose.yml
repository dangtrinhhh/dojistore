version: '3'

services:
  web:
    build: .
    command: ["sh", "-c", "sleep 10 && python manage.py migrate && python manage.py runserver 0.0.0.0:8000"]
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      - db
    environment:
      - DJANGO_DB_HOST=db
      - DJANGO_DB_PORT=5432
      - DJANGO_DB_NAME=doubletbad_restore
      - DJANGO_DB_USER=doubletbad
      - DJANGO_DB_PASSWORD=@Double2T.
    networks:
      - doublet-bad

  db:
    image: postgres:16
    environment:
      - POSTGRES_DB=doubletbad
      - POSTGRES_USER=doubletbad
      - POSTGRES_PASSWORD=@Double2T.
    volumes:
        - postgres-db-volume:/var/lib/postgresql/doubletbad
    ports:
        - 5432:5432
    networks:
      - doublet-bad
  
  pgadmin:
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: 'dangtrinh.dev@gmail.com'
      PGADMIN_DEFAULT_PASSWORD: '@Double2T.'
    ports:
      - 16543:80
    volumes:
      - /servers.json:/pgadmin4/servers.json
    networks:
      - doublet-bad

volumes:
    postgres-db-volume:
        driver: local
        driver_opts:
            type: none
            o: bind
            device: ./data

networks:
  doublet-bad:
    external: true