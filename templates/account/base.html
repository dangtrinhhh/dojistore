{% load static %}
<!-- templates/account/base.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC"
      crossorigin="anonymous"
    />
    <link rel="icon" href="{% static 'img/logo.png' %}" type="image/x-icon" />
    <link rel="stylesheet" type="text/css" href="{% static 'style.css' %}" />
    <link rel="stylesheet" type="text/css" href="{% static 'css/home.css' %}" />
    <link rel="stylesheet" type="text/css" href="{% static 'css/account_password.css' %}" />
    <link
      rel="stylesheet"
      href="{% static '/font/themify-icons-font/themify-icons.css' %}"
    />
    <link rel="stylesheet" href="{% static 'font/fontawesome/css/all.css' %}" />
    <title>DoubleT Bad | Forgot Password</title>

</head>
<body>
    <!-- Navbar Start -->
    {% include 'components/navbar.html' %}
    <!-- Navbar End -->

    <!-- Chatbot Button Start -->
    <button class="cart-btn btn-outline-primary border-2">
      <a class="shopping-bag-icon m-auto" href="/cart">
          <i class="fa fa-comments greentea-color"></i>
      </a>
    </button>
    <!-- Chatbot Button End -->

    <!-- Messages Start -->
    {% include 'components/messageAlert.html' with messages=messages %}
    <!-- Messages End -->
    <div style="height: 100vh; width: 100vw;">
        {% block content %}{% endblock %}
    </div>
    <script src="{% static 'js/main.js' %}"></script>
    <!-- Option 1: Bootstrap Bundle with Popper -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
      crossorigin="anonymous"
    ></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
</body>
</html>
