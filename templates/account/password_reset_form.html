{% extends 'account/base.html' %}
{% load static %}
{% block content %}
<div class="row justify-content-center align-items-center" style="height: 100vh; width: 100%">
    <section class="gradient-form h-100 w-100" style="background-color: #eee;">
        <div class="container py-5 h-100">
        <div class="row d-flex justify-content-center align-items-center h-100">
            <div class="col-xl-10">
            <div class="card rounded-3 text-black">
                <div class="row g-0">
                <div class="col-lg-6">
                    <div class="card-body p-md-5 mx-md-4">
    
                    <div class="text-center">
                        <img src="{% static 'img/logo.png' %}"
                        style="width: 285px;" alt="logo">
                    </div>
    
                    <h2 class="text-center m-4">Quên mật khẩu</h2>
                    </div>
                </div>
                <div class="col-lg-6 d-flex align-items-center gradient-custom-2">

                        <h2 class="mb-4">DoubleT Bad</h2>
                        <p class="small mb-0 fs-6">Email này chưa được đăng ký, hãy đăng ký trước.</p>
                        <br>
                        <b class="small mb-0 fs-6">Gửi email khôi phục không thành công.</b>
                    </div>                    
                </div>
                </div>
            </div>
            </div>
        </div>
        </div>
    </section>
</div>
{% endblock %}
