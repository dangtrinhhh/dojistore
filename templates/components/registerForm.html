{% load static %}
<link rel="stylesheet" href="{% static 'style.css' %}">
<div id="modal2" class="modal js-modal2">
    <div class="modal-container js-modal-container2">
      <div class="modal-close2">
        <i class="ti-close"></i>
      </div>

      <header class="modal-header-custom">Chào mừng đến với DoubleT Bad</header>

      <div class="modal-body">
        <!-- For: only use with id -->
        <form method="POST" action="{% url 'register' %}">
          {% csrf_token %}
          <label for="ticket-quantity" class="modal-label">
            <i class="ti-email"></i>
            Email
          </label>
          <input
            type="email"
            name="email"
            class="modal-input"
            placeholder="Nhập email"
            required=""
            autocomplete="username"
          />

          <label class="modal-label">
            <i class="ti-user"></i>
            Tên đăng nhập
          </label>
          <input
            type="text"
            name="username"
            class="modal-input"
            placeholder="Nhập tên đăng nhập"
            required=""
            autocomplete="username"
          />

          <label class="modal-label">
            <i class="ti-shopping-cart"></i>
            Mật khẩu
          </label>
          <input
            type="password"
            name="password"
            class="modal-input"
            placeholder="Nhập mật khẩu"
            required=""
            autocomplete="current-password"
          />

          <label class="modal-label">
            <i class="ti-shopping-cart"></i>
            Xác nhận mật khẩu
          </label>
          <input
            type="password"
            name="password2"
            class="modal-input"
            placeholder="Nhập lại mật khẩu để xác nhận"
            required=""
            autocomplete="current-password"
          />

          {% for message in messages %}
          <h3 style="color: red">{{ message}}</h3>
          {% endfor %}

          <input
            type="submit"
            name="register"
            value="Đăng ký"
            class="buy-tickets"
          />
        </form>
      </div>

      <div class="d-flex justify-content-between">
        <div class="mx-4 my-2">
          <a class="btn-login cursor-pointer" style="color: #000; font-size: 13px; text-decoration: none;">Đăng nhập</a>
        </div>
        <div class="mx-4 my-2">
          <a href="/accounts/password/reset/" style="color: #000; font-size: 13px; text-decoration: none;">Quên mật khẩu ?</a>
        </div>
      </div>
    </div>
</div>
