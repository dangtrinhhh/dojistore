{% load static %}
<link rel="stylesheet" href="{% static 'style.css' %}">
<div id="modal2" class="modal">
    <div class="modal-container js-modal-container2">
      <div class="modal-close2">
        <i class="ti-close"></i>
      </div>

      <header class="modal-header-custom">Welcome to DoubleT Bad</header>

      <div class="modal-body">
        <!-- For: only use with id -->
        <form method="POST">
          {% csrf_token %}
          <label for="ticket-quantity" class="modal-label">
            <i class="ti-email"></i>
            Email
          </label>
          <input
            type="email"
            name="email"
            class="modal-input"
            placeholder="Your email"
            required=""
            autocomplete="username"
          />

          <label class="modal-label">
            <i class="ti-user"></i>
            Username
          </label>
          <input
            type="text"
            name="username"
            class="modal-input"
            placeholder="Your username"
            required=""
            autocomplete="username"
          />

          <label class="modal-label">
            <i class="ti-shopping-cart"></i>
            Password
          </label>
          <input
            type="password"
            name="password"
            class="modal-input"
            placeholder="Your password"
            required=""
            autocomplete="current-password"
          />

          <label class="modal-label">
            <i class="ti-shopping-cart"></i>
            Confirm Password
          </label>
          <input
            type="password"
            name="password2"
            class="modal-input"
            placeholder="Confirm your password"
            required=""
            autocomplete="current-password"
          />

          {% for message in messages %}
          <h3 style="color: red">{{ message}}</h3>
          {% endfor %}

          <input
            type="submit"
            name="register"
            value="Register"
            class="buy-tickets"
          />
        </form>
      </div>

      <div class="d-flex justify-content-between">
        <div class="mx-4 my-2">
          <a class="btn-login cursor-pointer" style="color: #000; font-size: 13px; text-decoration: none;">Login</a>
        </div>
        <div class="mx-4 my-2">
          <a href="/accounts/password/reset/" style="color: #000; font-size: 13px; text-decoration: none;">Forgot password ?</a>
        </div>
      </div>
    </div>
</div>
