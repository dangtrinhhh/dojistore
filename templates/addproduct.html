<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Bán hàng</title>
    <link rel="icon" href="{% static 'img/logo.png' %}" type="image/x-icon" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/slick-carousel@1.8.1/slick/slick.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }

        h1 {
            margin-bottom: 30px;
        }

        form {
            max-width: 500px;
            margin-bottom: 30px;
        }

        form div {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
        }

        input[type="text"],
        textarea {
            width: 100%;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 5px;
            resize: vertical;
        }

        input[type="file"] {
            display: none;
        }

        .custom-file-upload {
            display: inline-block;
            padding: 6px 12px;
            cursor: pointer;
            background-color: #4CAF50;
            color: #fff;
            border-radius: 5px;
        }

        .custom-file-upload:hover {
            background-color: #45a049;
        }

        button[type="submit"] {
            background-color: #4CAF50;
            color: #fff;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        #slider {
            max-width: 600px;
            margin: 30px auto;
            position: relative;
        }

        #slider img {
            width: 100%;
            height: 300px;
            object-fit: cover;
            border-radius: 5px;
        }

        .slick-prev,
        .slick-next {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            z-index: 1;
            cursor: pointer;
            font-size: 24px;
            padding: 5px;
            background-color: #4CAF50;
            color: #fff;
            border: none;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .slick-prev {
            left: 10px;
        }

        .slick-next {
            right: 10px;
        }

        /* Custom styles for ratio buttons */
        .slick-dots {
            display: flex;
            justify-content: center;
            list-style: none;
            padding: 0;
            margin-top: 10px;
        }

        .slick-dots li {
            margin: 0 5px;
        }

        .slick-dots button {
            display: block;
            width: 12px;
            height: 12px;
            border: none;
            border-radius: 50%;
            cursor: pointer;
            background-color: #bbb;
            /* Ẩn văn bản trong nút */
            text-indent: -9999px;
            overflow: hidden;
        }

        .slick-dots .slick-active button {
            background-color: #4CAF50;
        }

        /* Ẩn danh sách nút ratio khi không có hình ảnh */
        .slick-dots.hidden {
            display: none;
        }
    </style>
</head>
<body>
    <h1>Trang Admin - Bán hàng</h1>
    <form id="product-form">
        <div>
            <label for="product-name">Tên sản phẩm:</label>
            <input type="text" id="product-name" required>
        </div>
        <div>
            <label for="product-description">Nội dung:</label>
            <textarea id="product-description" required></textarea>
        </div>
        <div>
            <label for="product-images">Hình ảnh:</label>
            <label class="custom-file-upload">
                Chọn hình ảnh
                <input type="file" id="product-images" name="product-images[]" multiple accept="image/*" required>
            </label>
        </div>
        <button type="submit">Lưu sản phẩm</button>
    </form>

    <!-- Slider section -->
    <div id="slider">
        <!-- The uploaded images will be displayed here as a slider -->
    </div>

    <!-- Load jQuery and Slick Slider -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/slick-carousel@1.8.1/slick/slick.min.js"></script>

    <script>
        // Function to initialize the Slick Slider
        
        function initSlider() {
            $('#slider').slick({
                dots: true,
                infinite: true,
                slidesToShow: 1,
                slidesToScroll: 1,
                prevArrow: '<button class="slick-prev">&#8249;</button>',
                nextArrow: '<button class="slick-next">&#8250;</button>',
                customPaging: function(slider, i) {
                    return '<button class="slider-dot"></button>';
                }
            });

            // Ẩn danh sách nút ratio khi không có hình ảnh
            const sliderImages = $('#slider img');
            if (sliderImages.length === 0) {
                $('.slick-dots').addClass('hidden');
            } else {
                $('.slick-dots').removeClass('hidden');
            }
        }

        // Function to handle form submission
        function handleFormSubmit(event) {
            event.preventDefault();
            const productName = document.getElementById('product-name').value;
            const productDescription = document.getElementById('product-description').value;
            const productImages = document.getElementById('product-images').files;
            
            // Xóa toàn bộ hình ảnh hiện tại trong slider
            $('#slider').slick('removeSlide', null, null, true);
            console.log(productImages)
            // Process the uploaded images and add them to the slider
            for (let i = 0; i < productImages.length; i++) {
                const reader = new FileReader();
                reader.onload = function (event) {
                    const imageSrc = event.target.result;
                    const imageElement = `<div><img src="${imageSrc}" alt="${productName}"></div>`;
                    $('#slider').slick('slickAdd', imageElement);
                    // Hiển thị nút ratio sau khi có hình ảnh
                    $('.slick-dots').removeClass('hidden');
                };
                reader.readAsDataURL(productImages[i]);
            }

            // Clear form fields after processing
            document.getElementById('product-form').reset();
        }
        
        // Wait for the document to be ready
        $(document).ready(function() {
            initSlider();
            $('#product-images').on('change', function(event) {
                // $('#slider').empty();
                // $('#slider').empty();
                handleFormSubmit(event);
            });
            // Listen for form submission
            // $('#product-form').on('submit', handleFormSubmit);
        });
        
    </script>
</body>
</html>
